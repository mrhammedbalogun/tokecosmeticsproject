# api.tokecosmetics.com -> the Dockerised Django API on 127.0.0.1:8001
#
# Deployed to /usr/local/apps/apache2/etc/conf.d/zz-api.conf on the VPS.
#
# ---------------------------------------------------------------------------
# THE FILENAME IS LOAD-BEARING. DO NOT RENAME THIS TO api.conf.
#
# httpd.conf line 521 is `Include etc/conf.d/*.conf`, which globs ALPHABETICALLY,
# and Apache treats the FIRST <VirtualHost> for an address as that address's
# DEFAULT — the one serving every request whose Host matches no other ServerName.
#
# Today that default is server1.tokecosmetics.com (webuzoVH.conf:12). A file named
# api.conf would sort before webuzo.conf/webuzoVH.conf, silently become the default
# for 203.161.38.201:443, and start serving Django to WordPress visitors.
#
# After ANY change here, before reloading:
#   /usr/local/apps/apache2/bin/httpd -t
#   /usr/local/apps/apache2/bin/httpd -S | grep -A2 '203.161.38.201:443'
# The "default server" line must still name a Webuzo vhost, not this one.
# ---------------------------------------------------------------------------
#
# Webuzo regenerates webuzoVH.conf on every panel save and its header says DO NOT
# EDIT, so this lives in its own included file and is left alone. Re-verify it is
# still present after any Webuzo settings change.

<VirtualHost 203.161.38.201:443>
    ServerName api.tokecosmetics.com

    SSLEngine on
    # Cloudflare Origin CA certificate (15-year). Cloudflare is the only thing that
    # should ever talk to this vhost; public TLS is terminated at Cloudflare's edge
    # and the SSL mode for this hostname is Full (strict).
    SSLCertificateFile    /etc/ssl/cloudflare/api.tokecosmetics.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/api.tokecosmetics.com.key

    ProxyPreserveHost On
    ProxyTimeout 75

    # Django's prod settings set SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO",
    # "https") and SECURE_SSL_REDIRECT = True. Without this header every proxied
    # request looks like plain HTTP to Django and gets 301'd into an infinite loop.
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    # The Django admin is a low-level fallback, not a public surface.
    <Location /django-admin/>
        Require ip HAMMED_IP_PLACEHOLDER
    </Location>

    ErrorLog  /usr/local/apps/apache2/logs/api.tokecosmetics.com.err
    CustomLog /usr/local/apps/apache2/logs/api.tokecosmetics.com.log combined
</VirtualHost>

<VirtualHost 203.161.38.201:80>
    ServerName api.tokecosmetics.com
    Redirect permanent / https://api.tokecosmetics.com/
</VirtualHost>
