# api.tokecosmetics.com -> the Dockerised Django API on 127.0.0.1:8001
#
# Deployed to /usr/local/apps/apache2/etc/conf.d/zz-api.conf on the VPS.
#
# ---------------------------------------------------------------------------
# THE FILENAME IS LOAD-BEARING. DO NOT RENAME THIS TO api.conf.
#
# httpd.conf line 521 is `Include etc/conf.d/*.conf`, which globs ALPHABETICALLY,
# and Apache treats the FIRST <VirtualHost> for an address as that address's
# DEFAULT — the one serving every request whose Host matches no other ServerName.
#
# Today that default is server1.tokecosmetics.com (webuzoVH.conf:12). A file named
# api.conf would sort before webuzo.conf/webuzoVH.conf, silently become the default
# for 203.161.38.201:443, and start serving Django to WordPress visitors.
#
# After ANY change here, before reloading:
#   /usr/local/apps/apache2/bin/httpd -t
#   /usr/local/apps/apache2/bin/httpd -S | grep -A2 '203.161.38.201:443'
# The "default server" line must still name a Webuzo vhost, not this one.
# ---------------------------------------------------------------------------
#
# Webuzo regenerates webuzoVH.conf on every panel save and its header says DO NOT
# EDIT, so this lives in its own included file and is left alone. Re-verify it is
# still present after any Webuzo settings change.

<VirtualHost 203.161.38.201:443>
    ServerName api.tokecosmetics.com

    SSLEngine on
    # Cloudflare Origin CA certificate (15-year). Cloudflare is the only thing that
    # should ever talk to this vhost; public TLS is terminated at Cloudflare's edge
    # and the SSL mode for this hostname is Full (strict).
    SSLCertificateFile    /etc/ssl/cloudflare/api.tokecosmetics.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/api.tokecosmetics.com.key

    ProxyPreserveHost On
    ProxyTimeout 75

    # Django's prod settings set SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO",
    # "https") and SECURE_SSL_REDIRECT = True. Without this header every proxied
    # request looks like plain HTTP to Django and gets 301'd into an infinite loop.
    RequestHeader set X-Forwarded-Proto "https"

    # -----------------------------------------------------------------------
    # ORIGIN LOCK — only Cloudflare may reach this vhost.
    #
    # 203.161.38.201 is public knowledge because the WordPress stores share it.
    # Without this block anyone can point a request straight at the origin with
    # `curl --resolve api.tokecosmetics.com:443:203.161.38.201` and bypass
    # Cloudflare's WAF and rate limiting completely. Verified exploitable from
    # outside the network on 2026-07-25, before this was added.
    #
    # Ranges are Cloudflare's published list, fetched 2026-07-25 from
    #   https://www.cloudflare.com/ips-v4  and  https://www.cloudflare.com/ips-v6
    # They change rarely, but they DO change. If the API starts 403'ing for no
    # apparent reason, re-fetch both lists and diff them against this block
    # BEFORE debugging anything else. That is the most likely cause.
    #
    # 127.0.0.1 is kept so on-box health checks and diagnostics still work.
    # -----------------------------------------------------------------------
    <Location />
        # Loopback, plus the box's own public address: an on-box
        # `curl --resolve api.tokecosmetics.com:443:203.161.38.201` presents
        # 203.161.38.201 as its source, not 127.0.0.1, so without the second line
        # every on-box diagnostic and deploy smoke test 403s. Grants nothing extra —
        # anything able to source packets from that address already has root.
        Require ip 127.0.0.1
        Require ip 203.161.38.201

        # Cloudflare IPv4
        Require ip 173.245.48.0/20
        Require ip 103.21.244.0/22
        Require ip 103.22.200.0/22
        Require ip 103.31.4.0/22
        Require ip 141.101.64.0/18
        Require ip 108.162.192.0/18
        Require ip 190.93.240.0/20
        Require ip 188.114.96.0/20
        Require ip 197.234.240.0/22
        Require ip 198.41.128.0/17
        Require ip 162.158.0.0/15
        Require ip 104.16.0.0/13
        Require ip 104.24.0.0/14
        Require ip 172.64.0.0/13
        Require ip 131.0.72.0/22

        # Cloudflare IPv6
        Require ip 2400:cb00::/32
        Require ip 2606:4700::/32
        Require ip 2803:f800::/32
        Require ip 2405:b500::/32
        Require ip 2405:8100::/32
        Require ip 2a06:98c0::/29
        Require ip 2c0f:f248::/32
    </Location>

    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/

    # The Django admin is a low-level fallback, not a public surface.
    #
    # This was going to be `Require ip <Hammed's IP>`. That cannot work here. Every
    # request to this vhost arrives from a Cloudflare edge server, so the client
    # address Apache authorises against is Cloudflare's, never Hammed's — and
    # mod_remoteip is not loaded (`httpd -M` confirms), so CF-Connecting-IP is not
    # promoted into the client address either. An IP allowlist would have returned
    # 403 to every request including his, with nothing in the logs to explain why.
    # His IP is also dynamic (shared house wifi), which would have broken it again.
    #
    # Decision 2026-07-25: leave it denied. Plans 16-20 build the real admin portal,
    # which is the interface Hammed will actually use. Revisit if break-glass access
    # is ever needed before then — the options were Cloudflare Access or an SSH tunnel.
    #
    # This relies on AuthMerging being Off (the default): the Require directives in
    # this more specific <Location> REPLACE the Cloudflare allowlist in <Location />
    # rather than being OR'd with it. If that default is ever changed, a Cloudflare
    # address would satisfy the outer rule and this deny would silently stop working.
    # Verified externally as 403 after the origin lock went in.
    <Location /django-admin/>
        Require all denied
    </Location>

    ErrorLog  /usr/local/apps/apache2/logs/api.tokecosmetics.com.err
    CustomLog /usr/local/apps/apache2/logs/api.tokecosmetics.com.log combined
</VirtualHost>

<VirtualHost 203.161.38.201:80>
    ServerName api.tokecosmetics.com
    Redirect permanent / https://api.tokecosmetics.com/
</VirtualHost>
