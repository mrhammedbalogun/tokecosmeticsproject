# Production stack for api.tokecosmetics.com.
#
# Nothing here is publicly reachable. Every published port is bound to 127.0.0.1 and
# Apache proxies api.tokecosmetics.com -> 127.0.0.1:8001 (see infra/proxy/zz-api.conf).
# That binding is a SECURITY CONTROL, not tidiness: Docker writes its own iptables rules
# that bypass the host firewall, so a bare "5433:5432" would put Postgres on the public
# internet even with ufw enabled — and ufw is currently inactive on this box.
#
# Memory budget ~2.6 GB against ~3.9 GB available. The live WordPress stores share this
# machine; a 4 GB swapfile (added 2026-07-25) is the backstop, not the plan.
#
# No Meilisearch: apps/search/backends.py::get_backend() returns PostgresSearchBackend()
# unconditionally, so search runs on pg_trgm. Add it back in Plan-07b.
name: tokecosmetics

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /opt/tokecosmetics/data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # --save "" disables RDB snapshots: Redis here is a cache and a Celery broker, and
    # anything worth keeping is in Postgres. Snapshotting would only cost IO and disk.
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "127.0.0.1:6380:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: toke-api:latest
    restart: unless-stopped
    env_file: /opt/tokecosmetics/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - /opt/tokecosmetics/data/static:/app/staticfiles
      - /opt/tokecosmetics/data/media:/app/media
    mem_limit: 768m
    # Both headers are required, for different reasons:
    #   Host: ALLOWED_HOSTS is api.tokecosmetics.com, so a request arriving as "localhost"
    #     is rejected with 400 — correctly. Spoofing the Host locally is how the check asks
    #     the same question a real proxied request asks.
    #   X-Forwarded-Proto: prod sets SECURE_SSL_REDIRECT=True, so plain HTTP would answer
    #     301. curl -f does NOT fail on a 3xx, so without this the check would pass on a
    #     redirect and report a dead app as healthy.
    healthcheck:
      test: ["CMD", "curl", "-fsS",
             "-H", "Host: api.tokecosmetics.com",
             "-H", "X-Forwarded-Proto: https",
             "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker:
    image: toke-api:latest
    restart: unless-stopped
    env_file: /opt/tokecosmetics/.env.prod
    command: celery -A config worker -c 2 --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - /opt/tokecosmetics/data/media:/app/media
    mem_limit: 512m

  beat:
    image: toke-api:latest
    restart: unless-stopped
    env_file: /opt/tokecosmetics/.env.prod
    command: celery -A config beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    # 256m, not the 128m the plan specified. Measured 2026-07-25: beat sits at
    # ~100 MB and reaches it within seconds of starting — that is its baseline, not
    # a leak, but it leaves 22% headroom for any spike. The failure mode is the
    # problem: exceeding mem_limit gets the container OOM-killed, restart:
    # unless-stopped brings it straight back, and nothing anywhere reports an
    # error. You would not find out until you noticed pending orders had stopped
    # expiring. 128 MB of a 3.2 GB surplus is not worth that.
    mem_limit: 256m
