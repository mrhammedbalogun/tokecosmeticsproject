[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3.1",
    "django==5.2.*",
    "django-anymail[resend]>=15.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-filter>=26.1",
    "django-storages[s3]>=1.14.6",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.4",
    "pillow>=11.0",
    "redis>=8.0.1",
    "whitenoise>=6.12.0",
    "httpx>=0.28.1",
    "stripe>=15.3.1",
    "weasyprint>=69.0",
    # Production WSGI server (Plan-02). Not used by runserver in dev, but the
    # container CMD is gunicorn, so it must be a real locked dependency.
    "gunicorn>=23.0.0",
    "pymysql>=1.1.0",
    "phpserialize>=1.3",
    "sentry-sdk>=2.66.1",
    # --- staff TOTP (Plan-16 Task 3b) ---
    # Pinned to a minor series, the same convention as django above: patch releases
    # (which for cryptography are usually the security ones) still flow, a minor bump
    # is a deliberate edit, and uv.lock records the exact build either way.
    #
    # pyotp RATHER THAN django-otp. django-otp's value is its session middleware and
    # its django.contrib.admin integration — precisely the machinery this project does
    # not have and does not want. Staff auth here is pure JWT with a private audience
    # claim (apps/accounts/authentication.py); adopting django-otp would mean fighting
    # its request/session model in order to throw most of it away. pyotp is a thin
    # RFC 6238 implementation and the ceremony is already ours.
    "pyotp==2.10.*",
    # cryptography (Fernet) for the TOTP secret AT REST. A TOTP secret is symmetric and
    # must be recoverable in order to verify a code, so it cannot be hashed. The database
    # does not stay on the VPS: it leaves nightly for an S3 bucket whose write key can
    # also delete, with versioning off (memory project_tokecosmetics_s3_backup_risk). In
    # a stolen dump, password hashes are slow to attack; plaintext TOTP secrets would be
    # the weakest artifact in the file — the second factor for every staff account, free.
    # Encrypting under an env-held key makes backup exfiltration non-fatal, because a
    # backup never contains the env. Fernet is the boring, most-vetted choice; there is
    # no homegrown crypto anywhere in this feature.
    "cryptography==49.0.*",
    "nh3>=0.3.6",
    # --- WordPress password migration (Plan-22) ---
    # Verifies BOTH modern WP hashes ($wp$ — bcrypt over an HMAC-SHA384 pre-hash) and the
    # plain $2y$ rows. pyca/bcrypt is actively maintained; passlib, which the spec reached
    # for, is not (1.7.4, 2020) and would serve exactly 86 users. phpass is ~25 lines and
    # is vendored in apps/accounts/hashers.py instead, so that dependency buys nothing.
    "bcrypt>=4.2.0",
    "phonenumbers>=9.0.37",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "moto[s3]>=5.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "respx>=0.23.1",
    "ruff>=0.15.21",
]
